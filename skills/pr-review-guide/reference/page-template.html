/* tweakcn's Clean Slate theme. Its light primary and muted text are a little darker here, which takes them to
   4.5:1 on every background they sit on. The signal colours, diff fills and --syn-* are this page's own. */
:root {
  --background: oklch(0.9842 0.0034 247.8575);
  --foreground: oklch(0.2795 0.0368 260.031);
  --card: oklch(1 0 0);
  --primary: oklch(0.56 0.2041 277.1173);
  --primary-foreground: oklch(1 0 0);
  --secondary: oklch(0.9276 0.0058 264.5313);
  --muted: oklch(0.967 0.0029 264.5419);
  --muted-foreground: oklch(0.545 0.0234 264.3637);
  --accent: oklch(0.9299 0.0334 272.7879);
  --border: oklch(0.8717 0.0093 258.3382);
  --ring: oklch(0.5854 0.2041 277.1173);
  --destructive: oklch(0.6368 0.2078 25.3313);
  --success: oklch(0.795 0.115 162);
  --warning: oklch(0.82 0.165 85);
  --warning-foreground: oklch(0.2795 0.0368 260.031);
  --success-foreground: oklch(0.2795 0.0368 260.031);
  --destructive-foreground: oklch(1 0 0);
  --success-high-contrast: oklch(0.521 0.11 162.19);
  --destructive-high-contrast: oklch(0.532 0.19 24.77);
  --warning-high-contrast: oklch(0.56 0.12 70);
  --move-bg: color-mix(in oklab, var(--primary) 8%, var(--card));
  --add-bg: color-mix(in oklab, var(--success) 18%, var(--card));
  --add-mark: color-mix(in oklab, var(--success) 48%, var(--card));
  --del-bg: color-mix(in oklab, var(--destructive) 11%, var(--card));
  --del-mark: color-mix(in oklab, var(--destructive) 30%, var(--card));
  --syn-keyword: oklch(0.5 0.18 300);
  --syn-string: oklch(0.5 0.12 150);
  --syn-number: oklch(0.55 0.15 50);
  --syn-title: oklch(0.5 0.16 258);
  --syn-type: oklch(0.52 0.11 205);
  --syn-attr: oklch(0.52 0.13 25);
  --font-sans: Inter, "Inter Variable", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 0.5rem;
  --shadow-sm: 0px 4px 8px -1px hsl(0 0% 0% / 0.1), 0px 1px 2px -2px hsl(0 0% 0% / 0.1);
}

    --primary: oklch(0.6801 0.1583 276.9349);
    --primary-foreground: oklch(0.2077 0.0398 265.7549);
    --secondary: oklch(0.3351 0.0331 260.912);
    --muted: oklch(0.2427 0.0381 259.9437);
    --muted-foreground: oklch(0.7137 0.0192 261.3246);
    --accent: oklch(0.3729 0.0306 259.7328);
    --border: oklch(0.4461 0.0263 256.8018);
    --ring: oklch(0.6801 0.1583 276.9349);
    --success: oklch(0.73 0.13 162);
    --warning: oklch(0.84 0.16 85);
    --warning-foreground: oklch(0.2077 0.0398 265.7549);
    --success-foreground: oklch(0.2077 0.0398 265.7549);

    --del-bg: color-mix(in oklab, var(--destructive) 14%, var(--card));

:root[data-theme="dark"] {
  --background: oklch(0.2077 0.0398 265.7549);
  --foreground: oklch(0.9288 0.0126 255.5078);
  --card: oklch(0.2795 0.0368 260.031);
  --primary: oklch(0.6801 0.1583 276.9349);
  --primary-foreground: oklch(0.2077 0.0398 265.7549);
  --secondary: oklch(0.3351 0.0331 260.912);
  --muted: oklch(0.2427 0.0381 259.9437);
  --muted-foreground: oklch(0.7137 0.0192 261.3246);
  --accent: oklch(0.3729 0.0306 259.7328);
  --border: oklch(0.4461 0.0263 256.8018);
  --ring: oklch(0.6801 0.1583 276.9349);
  --success: oklch(0.73 0.13 162);
  --warning: oklch(0.84 0.16 85);
  --warning-foreground: oklch(0.2077 0.0398 265.7549);
  --success-foreground: oklch(0.2077 0.0398 265.7549);
  --destructive-foreground: oklch(0.2077 0.0398 265.7549);
  --success-high-contrast: oklch(0.709 0.141 161.71);

  --move-bg: color-mix(in oklab, var(--primary) 14%, var(--card));

  --del-mark: color-mix(in oklab, var(--destructive) 36%, var(--card));
  --syn-keyword: oklch(0.78 0.13 305);
  --syn-string: oklch(0.8 0.11 150);
  --syn-number: oklch(0.8 0.12 60);
  --syn-title: oklch(0.78 0.11 255);

}

* { box-sizing: border-box; }
/* the attribute wins over a class's display, so a hidden section or card stays hidden */
[hidden] { display: none !important; }
body { background: var(--background); color: var(--foreground); font: 14px/1.55 var(--font-sans); padding-inline: 16px; padding-block: 0 4rem; }
.wrap { max-width: 112rem; margin-inline: auto; }
a { color: var(--primary); }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.plus { color: var(--success-high-contrast); }
.minus { color: var(--destructive-high-contrast); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
/* the theme button sits at the top of the page and scrolls away with it; muted until hovered or focused */
.theme { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 0.75rem); right: 1rem; z-index: 30; width: 1.75rem; height: 1.75rem; padding: 0;
  display: grid; place-items: center; color: var(--muted-foreground); background: transparent; border: 1px solid transparent; border-radius: 999px; cursor: pointer; }
.theme:hover, .theme:focus-visible { color: var(--foreground); background: var(--card); border-color: var(--border); }
.theme svg { width: 1rem; height: 1rem; }

/* header */
.top { padding-block: 1.5rem 1rem; display: grid; gap: 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
.crumbs { color: var(--muted-foreground); font-size: 13px; display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; }
.crumbs .mono { font-size: 12.5px; }
h1 { font-size: 1.6rem; font-weight: 650; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; color: var(--muted-foreground); font-size: 13px; }
.loc-wrap { position: relative; }
.loc { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.6rem; cursor: pointer; display: inline-flex; gap: 0.4rem; align-items: center; }
.loc:hover { background: var(--muted); }
.loc .star { color: var(--muted-foreground); font-family: var(--font-mono); font-size: 11px; }
.loc-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 0.6rem 0.8rem; min-width: 17rem; color: var(--foreground); }
.loc-pop table { border-collapse: collapse; width: 100%; }
.loc-pop td { padding: 0.15rem 0; }
.loc-pop td + td { text-align: right; padding-left: 1rem; }
.loc-pop tr.total td { border-top: 1px solid var(--border); padding-top: 0.35rem; font-weight: 600; }
.loc-pop .note { color: var(--muted-foreground); font-size: 12px; margin: 0.4rem 0 0; }
.progress { white-space: nowrap; }
.view { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.pick { font: inherit; font-size: 13px; color: var(--foreground); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.5rem; max-width: 22rem; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 0.1rem 0.6rem; cursor: pointer; color: var(--muted-foreground); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--secondary); color: var(--foreground); }
.filtering { color: var(--muted-foreground); font-size: 13px; }
.fmtchk { color: var(--muted-foreground); font-size: 13px; }
.filtering button { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.index { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.25rem; padding: 0; list-style: none; }
.index a { display: inline-flex; gap: 0.4rem; align-items: baseline; text-decoration: none; color: var(--foreground); border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.65rem; font-size: 13px; background: var(--card); }
.index a:hover { border-color: var(--ring); }
.index a .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-foreground); }
.index a.done { color: var(--muted-foreground); }
.index a.done .n::after { content: " ✓"; color: var(--success-high-contrast); }
.index a.noise { border-style: dashed; color: var(--muted-foreground); }
.index a.risky .n::before { content: "! "; color: var(--warning-high-contrast); font-weight: 700; }

/* the author's checklist before marking the PR ready */
.ready { display: grid; gap: 0.6rem; margin-top: 0.5rem; }
.ready h2 { font-size: 0.95rem; font-weight: 600; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { font-size: 12.5px; border-radius: 999px; padding: 0.15rem 0.65rem; white-space: nowrap; }
.chip.good { background: var(--success); color: var(--success-foreground); }
.chip.warn { background: var(--warning); color: var(--warning-foreground); }
.chip.bad { background: var(--destructive); color: var(--destructive-foreground); }
.ready details { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.45rem 0.75rem; }
.ready summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
.ready ul { margin: 0.4rem 0 0.2rem; padding-left: 1.1rem; display: grid; gap: 0.3rem; font-size: 13.5px; }
.ready .why-note { color: var(--muted-foreground); }
.ready .tellref { font-family: var(--font-mono); font-size: 12px; margin-right: 0.6rem; white-space: nowrap; }
.ready q { font-style: italic; }
.risk { margin: 0; padding: 0.4rem 0.6rem; border-radius: calc(var(--radius) - 2px); font-size: 13.5px;
  background: color-mix(in oklab, var(--warning) 22%, var(--card)); border-left: 3px solid var(--warning); }
.risk b { font-weight: 600; }

/* sections */
.sec { display: grid; grid-template-columns: minmax(17rem, 24rem) minmax(0, 1fr); gap: 1.5rem; padding-block: 1.25rem; border-bottom: 1px solid var(--border); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem); align-self: start; display: grid; gap: 0.75rem; min-width: 0; max-height: calc(100vh - 2rem); overflow-y: auto; }
.side h2 { font-size: 1.25rem; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
.secnum { display: flex; align-items: center; gap: 0.9rem; color: var(--muted-foreground); font-size: 13px; }
.secnum .mono { font-size: 12.5px; }
.side p { margin: 0; }
.side .why { font-size: 15px; }
.ref { color: inherit; text-decoration: underline dotted var(--muted-foreground); text-underline-offset: 3px; cursor: pointer; }
.ref:hover { text-decoration-color: var(--primary); color: var(--primary); }
.filelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
.filelist button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: baseline; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 0.35rem 0.6rem; cursor: pointer; }
.filelist button:hover { border-color: var(--ring); }
.filelist .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filelist .fdir { color: var(--muted-foreground); font-size: 12.5px; margin-left: 0.35rem; }
.filelist li.done .fname { color: var(--muted-foreground); }
.filelist li.done .fname::before { content: "✓ "; color: var(--success-high-contrast); }
.st-added .bn { color: var(--success-high-contrast); }
.st-deleted .bn { text-decoration: line-through; }
.chk { display: inline-flex; gap: 0.35rem; align-items: center; cursor: pointer; user-select: none; }
.chk input { accent-color: var(--primary); margin: 0; }
.body { display: grid; gap: 1rem; min-width: 0; }

/* file cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; overflow: hidden; scroll-margin-top: 1rem; }
.card > header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--border); background: var(--muted); }
.card.closed > header { border-bottom: 0; }
.card .path { min-width: 0; flex: 1 1 18rem; display: flex; gap: 0.5rem; align-items: baseline; overflow: hidden; }
.card .path .bn { font-weight: 600; white-space: nowrap; }
.card .path .dir { color: var(--muted-foreground); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 999px; padding: 0.05rem 0.5rem; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
.tag.split { border-style: dashed; }
.tag.fresh { border-color: var(--primary); color: var(--primary); }
.fold { background: none; border: 0; cursor: pointer; color: var(--muted-foreground); padding: 0 0.25rem; }
.card.closed .diffwrap, .card.closed .hidden-note { display: none; }
.hidden-note { padding: 1.25rem; text-align: center; color: var(--muted-foreground); display: grid; gap: 0.5rem; justify-items: center; }
.btn { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 0.25rem 0.75rem; cursor: pointer; }
.btn:hover { border-color: var(--ring); }
.diffwrap { overflow-x: auto; }
table.d { border-collapse: collapse; width: 100%; font: 12.5px/1.6 var(--font-mono); font-variant-ligatures: none; }
table.d td { padding: 0; vertical-align: top; }
table.d td.ln { width: 1%; min-width: 3.2rem; padding-inline: 0.6rem 0.4rem; text-align: right; color: var(--muted-foreground); user-select: none; position: relative; }
table.d td.sg { width: 1.2rem; text-align: center; user-select: none; color: var(--muted-foreground); }
table.d td.code { white-space: pre; padding-right: 1.5rem; }
/* split view: two halves of fixed width, long lines wrapping inside their half */
table.d.split { table-layout: fixed; }
table.d.split col.c-ln { width: 3.6rem; }
table.d.split col.c-sg { width: 1.2rem; }
table.d.split td.code { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 0.75rem; }
table.d.split td.ln:nth-child(4) { border-left: 1px solid var(--border); }
table.d td.empty { background: var(--muted); }
td.add { background: var(--add-bg); }
td.sg.add { color: var(--success-high-contrast); }
td.del { background: var(--del-bg); }
td.sg.del { color: var(--destructive-high-contrast); }
td.add mark { background: var(--add-mark); color: inherit; border-radius: 2px; }
td.del mark { background: var(--del-mark); color: inherit; border-radius: 2px; }
td.moved { background: var(--move-bg); }
td.sg.moved { color: var(--primary); }
td.noise.code, td.noise.sg { opacity: 0.55; }
td.noise.ln::before { content: "fmt"; position: absolute; left: 0.25rem; font-size: 9.5px; letter-spacing: 0.04em; color: var(--muted-foreground); }
tbody.dim { opacity: 0.35; }
tbody.fresh td.ln:first-child { box-shadow: inset 2px 0 0 var(--primary); }
tr.mv td { background: var(--move-bg); color: var(--muted-foreground); font-family: var(--font-sans); font-size: 12.5px; padding: 0.2rem 0.6rem; white-space: normal; }
tr.mv button { background: none; border: 0; cursor: pointer; color: var(--muted-foreground); padding: 0; margin-left: 0.5rem; text-decoration: underline dotted; text-underline-offset: 3px; }
tr.mv button:hover { color: var(--primary); }
tr.ann td { padding: 0.35rem 0.75rem 0.45rem 4.6rem; background: var(--card); border-block: 1px solid var(--border); font-family: var(--font-sans); font-size: 13px; white-space: normal; }
tr.ann .lvl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 999px; padding: 0.05rem 0.5rem; margin-right: 0.5rem; }
tr.ann .lvl.failure { background: var(--destructive); color: var(--destructive-foreground); }
tr.ann .lvl.warning { background: var(--warning); color: var(--warning-foreground); }
tr.ann .msg { white-space: pre-wrap; }
tr.ann .why-note { color: var(--muted-foreground); }
tr.gap td { background: var(--muted); color: var(--muted-foreground); font-family: var(--font-sans); font-size: 12.5px; padding: 0.2rem 0.6rem; }
tr.gap button { background: none; border: 0; cursor: pointer; color: var(--muted-foreground); padding: 0; }
tr.gap button:hover { color: var(--primary); }
tr.gap .ctx { font-family: var(--font-mono); margin-left: 1rem; opacity: 0.8; }
td.ln.has-note, tbody.fresh td.ln.has-note:first-child { box-shadow: inset 3px 0 0 var(--warning); }
.tellmark { position: absolute; right: 0.1rem; top: 0; font: 700 11px/1.6 var(--font-sans); color: var(--destructive-high-contrast); }
tr.flash { outline: 2px solid var(--ring); outline-offset: -2px; }
.cbtn { display: none; position: absolute; left: 0.1rem; top: 0.1rem; width: 1.3rem; height: 1.3rem; border-radius: 4px; border: 1px solid var(--border); background: var(--card); color: var(--primary); cursor: pointer; padding: 0; line-height: 1; font-size: 12px; }
body.can-comment .cbtn { display: block; opacity: 0; }
body.can-comment tr.line:hover .cbtn, body.can-comment .cbtn:focus-visible { opacity: 1; }
@media (hover: none) { body.can-comment .cbtn { opacity: 1; } }
tr.composer td, tr.note td { padding: 0.5rem 0.75rem 0.75rem 4.6rem; background: var(--card); border-block: 1px solid var(--border); }
.cmp { display: grid; gap: 0.4rem; max-width: 48rem; font-family: var(--font-sans); }
.cmp-loc { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
.cmp textarea { font: 14px/1.5 var(--font-sans); color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 0.45rem 0.6rem; resize: vertical; width: 100%; }
.cmp-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: 0.6; cursor: default; }
.cmp-msg { color: var(--muted-foreground); font-size: 13px; }
.note-text { white-space: pre-wrap; font: 14px/1.5 var(--font-sans); }
.notes { margin-top: 1rem; padding: 0.6rem 0.75rem; border-radius: var(--radius); font-size: 13.5px; display: grid; gap: 0.4rem;
  background: color-mix(in oklab, var(--warning) 22%, var(--card)); border-left: 3px solid var(--warning); }
.notes-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
.notes ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.3rem; }
.notes .ref { font-family: var(--font-mono); font-size: 12.5px; }
.notes .why-note { color: var(--muted-foreground); white-space: pre-wrap; }
.notes .copybox { width: 100%; font: 12.5px/1.5 var(--font-mono); color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 0.4rem 0.5rem; }
.notes .x { border: 0; background: none; color: var(--muted-foreground); cursor: pointer; padding: 0 0.25rem; }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--syn-keyword); }

      td.innerHTML = m.side === "-" ? `${n} lines moved unchanged to <a href="#" class="ref">${where}</a>${sec}<button type="button">Show them</button>`
        : `${n} lines moved here unchanged from <a href="#" class="ref">${where}</a>${sec}`;
      td.querySelector("a").onclick = e => { e.preventDefault(); if (there) goToRow(`${P}r-${there.f.id}-${m.line}`, there.h.id); };
      const show = td.querySelector("button");
      if (show) show.onclick = () => tr.replaceWith(...h.lines.slice(m.start, m.end).map((row, k) => lineRow(f, row, lang, [], htmls[m.start + k])));
      return tr;
    }

    // ---- rendering a file card with a chosen set of hunks ----
    const owner = {};   // hunk id -> section index, for "changes shown in §n" gaps
    // The section a hunk shows in, or null when that is the formatting section and formatting is hidden.
    const shownIn = id => owner[id] != null && (fmtPref || D.sections[owner[id]].kind !== "formatting") ? owner[id] : null;
    function hunkEnd(h) { return { o: h.oldStart + h.oldLines, n: h.newStart + h.newLines }; }

    function gapRow(f, fromNew, toNew, oldOffset, other, lang) {
      const tr = el("tr", "gap");
      const count = toNew - fromNew + 1;
      const td = el("td");
      td.colSpan = COLS();
      tr.appendChild(td);
      if (other) {
        const s = D.sections[other.sec];
        td.innerHTML = `${count} lines between, with changes shown in <a href="#" class="ref">§${pad2(other.sec + 1)} ${esc(s.title)}</a>`;
        td.querySelector("a").onclick = e => { e.preventDefault(); goTo(other.hunk, other.sec); };
        return tr;
      }
      const canExpand = f.newText && count <= 2000;
      const label = `${count} unchanged line${count === 1 ? "" : "s"}`;
      if (!canExpand) { td.textContent = label; return tr; }
      td.innerHTML = `<button type="button">↕ ${label}</button>`;
      td.querySelector("button").onclick = () => {
        const rows = [];
        const texts = f.newText.slice(fromNew - 1, toNew);
        const htmls = lang === "bru" ? hlBru(texts, bruBefore(f, fromNew)) : hlLines(texts, lang);
        for (let n = fromNew; n <= toNew; n++) rows.push(lineRow(f, [" ", n + oldOffset, n, texts[n - fromNew] ?? ""], lang, [], htmls[n - fromNew]));
        tr.replaceWith(...rows);
      };
      return tr;
    }

    function buildDiff(f, hunkIds, secIdx) {
      const lang = langOf(f.path);
      const table = el("table", "d" + (isSplit() ? " split" : ""));
      if (isSplit()) table.innerHTML = `<colgroup><col class="c-ln"><col class="c-sg"><col><col class="c-ln"><col class="c-sg"><col></colgroup>`;
      const shown = f.hunks.filter(h => hunkIds.includes(h.id));
      const all = f.hunks;
      let prevEnd = { o: 1, n: 1 };
      let prevIdx = -1;
      shown.forEach(h => {
        const idx = all.indexOf(h);
        const between = all.slice(prevIdx + 1, idx);
        const offset = (h.oldStart - h.newStart);
        const tb = el("tbody");
        tb.id = `${P}h-${h.id}-s${secIdx}`;
        tb.dataset.h = h.id;
        if (M.lastPass && h.fresh) tb.classList.add("fresh");
        // Gaps sit in their own tbody so expanding one never shifts the rows comments are pinned to.
        const gapTb = el("tbody");
        table.appendChild(gapTb);
        const gapFrom = prevIdx < 0 ? 1 : prevEnd.n;
        const gapTo = h.newStart - 1;
        if (between.length) {
          const b = between.find(x => shownIn(x.id) != null && shownIn(x.id) !== secIdx) || between[0];
          const sec = shownIn(b.id);
          if (sec != null && sec !== secIdx) gapTb.appendChild(gapRow(f, gapFrom, Math.max(gapFrom, gapTo), offset, { sec, hunk: b.id }, lang));
          else gapTb.appendChild(gapRow(f, gapFrom, Math.max(gapFrom, gapTo), offset, null, lang));
        } else if (gapTo >= gapFrom && f.status !== "added" && f.status !== "deleted") {
          gapTb.appendChild(gapRow(f, gapFrom, gapTo, offset, null, lang));
        }
        if (h.header) {
          const head = gapTb.querySelector("tr.gap td");
          if (head && !head.querySelector("a")) head.insertAdjacentHTML("beforeend", `<span class="ctx">${esc(h.header)}</span>`);
        }
        const code = {};
        const rows = hunkRows(f, h, lang, code);
        wordMarks(h, code);
        const cutoff = f.status === "deleted" && rows.length > 200 ? 30 : Infinity;
        rows.slice(0, cutoff).forEach(tr => tb.appendChild(tr));
        if (cutoff < rows.length) {
          const more = el("tr", "gap");
          more.innerHTML = `<td colspan="${COLS()}"><button type="button">Show ${rows.length - cutoff} more removed lines</button></td>`;
          more.querySelector("button").onclick = () => more.replaceWith(...rows.slice(cutoff));
          tb.appendChild(more);
        }
        table.appendChild(tb);
        if (XREF[h.id]) { const xt = el("tbody"); xt.appendChild(xrefRow(XREF[h.id])); table.appendChild(xt); }
        prevEnd = hunkEnd(h);
        prevIdx = idx;
      });
      const last = shown[shown.length - 1];
      const after = last ? all.slice(all.indexOf(last) + 1) : [];
      const elsewhere = after.find(x => shownIn(x.id) != null && shownIn(x.id) !== secIdx);
      if (elsewhere) {
        const end = hunkEnd(last);
        const tb = el("tbody");
        tb.appendChild(gapRow(f, end.n, Math.max(end.n, elsewhere.newStart - 1), end.o - end.n, { sec: shownIn(elsewhere.id), hunk: elsewhere.id }, lang));
        table.appendChild(tb);
      } else if (last && f.newText && !after.some(x => shownIn(x.id) != null)) {
        const end = hunkEnd(last);
        const total = f.newText.length - (f.newText[f.newText.length - 1] === "" ? 1 : 0);
        if (total >= end.n) {
          const tb = el("tbody");
          tb.appendChild(gapRow(f, end.n, total, end.o - end.n, null, lang));
          table.appendChild(tb);
        }
      }
      return table;
    }

    // ---- word-level marks inside paired removed and added lines of each real change ----
    function wordMarks(h, code) {
      const skip = new Set(h.blocks.flatMap(b => b.reindented || []));
      (h.moves || []).forEach(m => { for (let i = m.start; i < m.end; i++) skip.add(i); });
      h.blocks.forEach(b => {
        if (b.noise) return;
        const dels = [], adds = [];
        for (let i = b.start; i < b.end; i++) if (!skip.has(i)) (h.lines[i][0] === "-" ? dels : adds).push(i);
        const pairs = Math.min(dels.length, adds.length);
        if (!pairs || Math.max(dels.length, adds.length) > pairs * 2) return;
        for (let k = 0; k < pairs; k++) {
          const a = h.lines[dels[k]][3], c = h.lines[adds[k]][3];
          const [ra, rb] = changedRanges(a, c);
          if (ra.reduce((s, r) => s + r[1] - r[0], 0) > a.length * 0.7) continue;
          if (code[dels[k]]) markRanges(code[dels[k]], ra);
          if (code[adds[k]]) markRanges(code[adds[k]], rb);
        }
      });
    }

    function lineCounts(f, hunkIds) {
      if (!f.hunks.length) return [f.additions, f.deletions];
      let add = 0, del = 0;
      f.hunks.filter(h => hunkIds.includes(h.id)).forEach(h => h.lines.forEach(r => { if (r[0] === "+") add++; else if (r[0] === "-") del++; }));
      return [add, del];
    }

    function fileCard(f, hunkIds, secIdx, sec) {
      const card = el("article", "card st-" + f.status);
      card.id = `${P}c-${secIdx}-${f.id}`;
      const [bn, dir] = split(f.path);
      const [add, del] = lineCounts(f, hunkIds);
      const tags = [];
      if (f.status === "renamed") tags.push(`<span class="tag" title="from ${esc(f.oldPath)}">renamed</span>`);
      if (f.category !== "implementation") tags.push(`<span class="tag">${esc(f.category)}</span>`);
      if (sec.kind === "guide" && f.hunks.some(h => !hunkIds.includes(h.id) && shownIn(h.id) != null)) tags.push(`<span class="tag split" title="Other hunks of this file are in other sections">part</span>`);
      if (M.lastPass && hunkIds.some(id => hunks[id].h.fresh)) tags.push(`<span class="tag fresh" title="Changed since the page built at ${esc(M.lastPass.headSha.slice(0, 7))}">new</span>`);
      const key = tickKey({ id: f.id, hunks: hunkIds });
      card.innerHTML = `<header><button class="fold" type="button" aria-label="Collapse">▾</button>`
        + `<div class="path"><span class="bn">${esc(bn)}</span><span class="dir">${esc(dir)}</span></div>${tags.join("")}`
        + `<span class="num">${counts(add, del)}</span>`
        + `<label class="chk"><input type="checkbox" data-key="${esc(key)}"> Reviewed</label></header>`;
      const body = el("div", "diffwrap");
      const hiddenByDefault = f.noise || (sec.kind === "formatting");
      if (f.binary) body.innerHTML = `<div class="hidden-note">Binary file, nothing to show.</div>`;
      else if (!f.hunks.length) body.innerHTML = `<div class="hidden-note">${f.status === "renamed" ? `Renamed from <code>${esc(f.oldPath)}</code> with no changes.` : "No line changes."}</div>`;
      else if (f.noise && sec.kind === "generated") {
        const what = f.category === "lockfile" ? "Lock files" : "Generated files";
        body.innerHTML = `<div class="hidden-note">${what} are not shown by default.<button class="btn" type="button">Show diff</button></div>`;
        body.querySelector("button").onclick = () => { body.replaceChildren(buildDiff(f, hunkIds, secIdx)); };
      } else body.appendChild(buildDiff(f, hunkIds, secIdx));
      card.appendChild(body);
      const cb = card.querySelector("input");
      cb.checked = isDone(key);
      if (cb.checked && !hiddenByDefault) card.classList.add("closed");
      cb.onchange = () => { setDone(key, cb.checked); card.classList.toggle("closed", cb.checked); refreshTicks(); };
      card.querySelector(".fold").onclick = () => { card.classList.toggle("closed"); };
      return card;
    }

    // ---- links inside the section text: [phrase](f3h2) or [phrase](f3), or [phrase](1014:f3h2) into another layer ----
    function prose(text) {
      return esc(text).replace(/\[([^\]]+)\]\(((?:\d+:)?f\d+(?:h\d+)?)\)/g, (_m, phrase, id) => `<a href="#" class="ref" data-to="${id}">${phrase}</a>`);
    }
    function goTo(id, secHint) {
      const x = /^(\d+):(.+)$/.exec(id);
      if (x) {
        if (+x[1] !== M.number) return jump(+x[1], x[2]);
        id = x[2];
      }
      let target = null;
      if (/h\d+$/.test(id)) {
        const sec = owner[id] ?? secHint;
        const tb = $(`h-${id}-s${sec}`);
        target = tb && (tb.querySelector("tr.chg") || tb.querySelector("tr"));
      } else {
        target = $(`c-${secHint}-${id}`) || document.querySelector(`[id^="${P}c-"][id$="-${id}"]`);
      }
      if (target) reveal(target);
    }

    // ---- names this hunk shares with other layers of the stack ----
    function xrefRow(xs) {
      const tr = el("tr", "xref"), td = el("td");
      td.colSpan = COLS();
      const part = (up, label) => {
        const mine = xs.filter(x => x.up === up);
        if (!mine.length) return "";
        const shown = mine.slice(0, 8).map(x => `<code>${esc(x.name)}</code> ${refLinks(x.refs)}`).join("; ");
        return `<div>${label} ${shown}${mine.length > 8 ? `; and ${mine.length - 8} more` : ""}</div>`;
      };
      td.innerHTML = part(true, "Used further up the stack:") + part(false, "Defined further down the stack:");
      td.querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); goTo(a.dataset.to); });
      tr.appendChild(td);
      return tr;
    }

    // ---- page ----
    function header() {
      const ref = M.number ? `${M.repo}#${M.number}` : M.repo;
      $("crumbs").innerHTML = (M.url ? `<a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(ref)}</a>` : `<span>${esc(ref)}</span>`)
        + `<span class="mono">${esc(M.base)} ← ${esc(M.head)}</span><span class="mono">${esc(M.mergeBase.slice(0, 7))}…${esc(SHA7)}</span>`
        + (M.issues || []).map(x => {
          const title = x.closes === false ? "Linked; this PR doesn't close it" : "This PR closes it";
          return x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener" title="${title}">${esc(x.ref)}</a>` : `<span title="${title}">${esc(x.ref)}</span>`;
        }).join("");
      $("title").textContent = M.title;
      const S = D.stats, impl = S.categories.implementation || { add: 0, del: 0, files: 0 };
      const differs = impl.add !== S.total.add || impl.del !== S.total.del;
      const NAMES = { implementation: "Implementation", test: "Tests", docs: "Documentation", generated: "Generated", lockfile: "Lock files",
        "agent-guidance": "Agent guidance", localization: "Localization", assets: "Assets" };
      const rows = Object.entries(S.categories).sort((a, b) => (a[0] === "implementation" ? -1 : b[0] === "implementation" ? 1 : 0))
        .map(([k, v]) => `<tr><td>${esc(NAMES[k] || k)} <span class="mono" style="color:var(--muted-foreground)">${v.files}</span></td><td class="num">${counts(v.add, v.del)}</td></tr>`);
      if (S.noise.add || S.noise.del) rows.push(`<tr><td>Formatting only</td><td class="num">${counts(S.noise.add, S.noise.del)}</td></tr>`);
      rows.push(`<tr class="total"><td>Total <span class="mono" style="color:var(--muted-foreground)">${S.total.files}</span></td><td class="num">${counts(S.total.add, S.total.del)}</td></tr>`);
      // Which part of the change to show: everything, what is new since the last page, or one commit.
      const opts = [`<option value="">All changes</option>`];
      const L = M.lastPass;
      if (L) opts.push(`<option value="fresh">New since ${esc(L.headSha.slice(0, 7))}${L.at ? `, ${ago(L.at)}` : ""} (${L.fresh} hunk${L.fresh === 1 ? "" : "s"})</option>`);
      // Only commits that own a hunk: a merge from the base branch usually owns none.
      const owning = new Set(D.files.flatMap(f => f.hunks.flatMap(h => h.commits || [])));
      if (M.commitMap) (M.commits || []).forEach((c, i) => { if (owning.has(i)) opts.push(`<option value="c${i}">${esc(c.split("\n")[0].slice(0, 90))}</option>`); });
      const meta = $("meta");
      meta.innerHTML = `<span>${esc(M.author)}</span>`
        + `<span class="loc-wrap"><button class="loc" type="button" aria-expanded="false"><span class="num">${counts(impl.add, impl.del)}</span>${differs ? `<span class="star">(*)</span>` : ""}</button>`
        + `<div class="loc-pop" hidden><table>${rows.join("")}</table><p class="note">The headline counts implementation lines, leaving out tests, docs, generated files and formatting-only changes.`
        + `${S.moved ? ` ${S.moved} added lines only moved, unchanged, and are counted where they landed.` : ""}</p></div></span>`
        + `<span class="progress" id="${P}progress"></span>`
        + `<span class="view">${opts.length > 1 ? `<select class="pick" id="${P}pick" aria-label="Which part of the change to show">${opts.join("")}</select>` : ""}`
        + `<span class="seg" role="group" aria-label="Diff layout"><button type="button" data-view="unified">Unified</button><button type="button" data-view="split">Split</button></span>`
        + `<label class="chk fmtchk" title="Show formatting-only changes, dimmed"><input type="checkbox"> Formatting</label></span>`
        + `<span class="filtering" id="${P}filtering" hidden></span>`;
      const btn = meta.querySelector(".loc"), pop = meta.querySelector(".loc-pop");
      btn.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; btn.setAttribute("aria-expanded", String(!pop.hidden)); };
      document.addEventListener("click", e => { if (!pop.hidden && !pop.contains(e.target)) { pop.hidden = true; btn.setAttribute("aria-expanded", "false"); } });
      const pick = $("pick");
      if (pick) pick.onchange = () => { FILTER = pick.value; applyFilter(); };
      meta.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
        splitPref = b.dataset.view === "split";
        try { localStorage.setItem("prg:view", splitPref ? "split" : "unified"); } catch (e) { /* storage blocked: the choice lasts this visit */ }
        redrawAll();
      });
      meta.querySelector(".fmtchk input").onchange = e => {
        fmtPref = e.target.checked;
        try { localStorage.setItem("prg:fmt", fmtPref ? "show" : "hide"); } catch (err) { /* storage blocked: the choice lasts this visit */ }
        redrawAll();
      };
    }

    function sectionText(sec, i, guideCount) {
      if (sec.kind === "formatting") return { title: "Formatting only", why: "These hunks only change layout, the quotes or punctuation a formatter settles, or the order of imports, so they are kept out of the sections above.", how: "Each one is shown dimmed. A hunk that also has real changes stays in its section, with just its formatting lines dimmed." };
      if (sec.kind === "generated") return { title: "Lock and generated files", why: "Lock files and generated code change as a side effect of the other changes.", how: "They are collapsed; open one with Show diff if the regeneration itself needs checking." };
      return sec;
    }

    // The sections and their diffs, drawn again when the layout changes.
    function sections() {
      const main = $("guide"), index = $("index");
      main.replaceChildren();
      index.replaceChildren();
      document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.view === "split") === splitPref)));
      document.querySelectorAll(".fmtchk input").forEach(x => { x.checked = fmtPref; });
      const guideCount = D.sections.filter(s => s.kind === "guide").length;
      D.sections.forEach((sec, i) => sec.files.forEach(x => x.hunks.forEach(h => { owner[h] = i; })));
      D.sections.forEach((sec, i) => {
        const t = sectionText(sec, i, guideCount);
        const s = el("section", "sec");
        s.id = `${P}s${i + 1}`;
        const side = el("aside", "side");
        const num = sec.kind === "guide" ? `<span class="mono">${pad2(i + 1)} / ${pad2(guideCount)}</span>` : "";
        side.innerHTML = `<h2>${esc(t.title)}</h2><div class="secnum">${num}<label class="chk"><input type="checkbox" class="secchk"> Reviewed</label></div>`
          + (sec.risk ? `<p class="risk"><b>Careful read:</b> ${esc(sec.risk)}</p>` : "")
          + `<p class="why">${prose(t.why)}</p><p class="how">${prose(t.how)}</p>`;
        const list = el("ul", "filelist");
        const body = el("div", "body");
        sec.files.forEach(x => {
          const f = files[x.id];
          const card = fileCard(f, x.hunks, i, sec);
          body.appendChild(card);
          const [add, del] = lineCounts(f, x.hunks);
          const [bn, dir] = split(f.path);
          const li = el("li", "st-" + f.status);
          li.dataset.key = tickKey(x);
          li.dataset.card = card.id;
          li.innerHTML = `<button type="button" title="${esc(f.path)}"><span class="fname"><span class="bn">${esc(bn)}</span><span class="fdir">${esc(dir.replace(/\/$/, ""))}</span></span><span class="num">${counts(add, del)}</span></button>`;
          li.querySelector("button").onclick = () => { card.classList.remove("closed"); card.scrollIntoView({ block: "start", behavior: reduced ? "auto" : "smooth" }); };
          list.appendChild(li);
        });
        side.appendChild(list);
        side.querySelectorAll("a.ref").forEach(a => a.onclick = e => { e.preventDefault(); goTo(a.dataset.to, i); });
        const secchk = side.querySelector(".secchk");
        secchk.onchange = () => {
          sec.files.forEach(x => setDone(tickKey(x), secchk.checked));
          body.querySelectorAll(".card").forEach(c => { c.querySelector("input").checked = secchk.checked; c.classList.toggle("closed", secchk.checked); });
          refreshTicks();
        };
        s.append(side, body);
        main.appendChild(s);
        const li = el("li");
        li.innerHTML = `<a href="#${P}s${i + 1}" class="${sec.kind === "guide" ? (sec.risk ? "risky" : "") : "noise"}" data-sec="${i}"><span class="n">${sec.kind === "guide" ? pad2(i + 1) : "·"}</span>${esc(t.title)}</a>`;
        index.appendChild(li);
      });
      refreshTicks();
      markLines();
      applyFilter();
    }

    function refreshTicks() {
      let done = 0, total = 0;
      D.sections.forEach((sec, i) => {
        const keys = sec.files.map(tickKey);
        const n = keys.filter(isDone).length;
        if (sec.kind === "guide") { done += n; total += keys.length; }
        const s = $(`s${i + 1}`);
        const chk = s.querySelector(".secchk");
        chk.checked = n === keys.length && n > 0;
        chk.indeterminate = n > 0 && n < keys.length;
        s.querySelectorAll(".filelist li").forEach(li => li.classList.toggle("done", isDone(li.dataset.key)));
        const a = $("index").querySelector(`a[data-sec="${i}"]`);
        if (a) a.classList.toggle("done", chk.checked);
      });
      $("progress").textContent = total ? `${done} of ${total} files reviewed` : "Nothing to review beyond formatting and generated files";
    }

    // Hides what the chosen part of the change doesn't touch: whole cards and sections, and dims the other hunks
    // of a card it does touch.
    function applyFilter() {
      const on = !!FILTER;
      const hit = h => FILTER === "fresh" ? !!h.fresh : (h.commits || []).includes(+FILTER.slice(1));
      let nh = 0, nf = 0;
      D.sections.forEach((sec, i) => {
        const s = $(`s${i + 1}`);
        let shown = 0;
        sec.files.forEach(x => {
          const card = $(`c-${i}-${x.id}`), mine = on ? x.hunks.filter(id => hit(hunks[id].h)) : x.hunks;
          const off = on && !mine.length;
          card.hidden = off;
          card.querySelectorAll("tbody[data-h]").forEach(tb => tb.classList.toggle("dim", on && !mine.includes(tb.dataset.h)));
          const li = s.querySelector(`.filelist li[data-card="${card.id}"]`);
          if (li) li.hidden = off;
          if (!off) { shown++; nf++; nh += mine.length; }
        });
        const off = !shown || (sec.kind === "formatting" && !fmtPref);
        s.hidden = off;
        const a = $("index").querySelector(`a[data-sec="${i}"]`);
        if (a) a.parentElement.hidden = off;
      });
      const note = $("filtering");
      note.hidden = !on;
      if (!on) return;
      note.innerHTML = `Showing ${nh} hunk${nh === 1 ? "" : "s"} in ${nf} file${nf === 1 ? "" : "s"}. <button type="button">Show everything</button>`;
      note.querySelector("button").onclick = () => { FILTER = ""; $("pick").value = ""; applyFilter(); };
    }

    // Flags and CI annotations, on the lines they are about. Run again whenever the diffs are drawn.
    function markLines() {
      (D.tells || []).forEach(t => {
        const td = $(`r-${t.file}-${t.line}`);
        if (td && !td.querySelector(".tellmark")) td.insertAdjacentHTML("beforeend", `<span class="tellmark" title="${esc(t.label)}">!</span>`);
      });
      const at = {};
      (D.annotations || []).filter(a => a.row).forEach(a => (at[`${a.file}-${a.row}`] = at[`${a.file}-${a.row}`] || []).push(a));
      Object.entries(at).forEach(([k, as]) => {
        const td = $(`r-${k}`);
        if (!td) return;
        let after = td.closest("tr");
        as.forEach(a => {
          const tr = el("tr", "ann"), cell = el("td");
          cell.colSpan = COLS();
          cell.innerHTML = `<span class="lvl ${esc(a.level)}">${esc(a.level)}</span>${a.title ? `<b>${esc(a.title)}</b> ` : ""}<span class="msg"></span> `
            + `<span class="why-note">${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.check)}</a>` : esc(a.check)}</span>`;

    // ---- what the author should settle before marking the PR ready ----

        if (!seen.has(label)) seen.set(label, h);
      });
      return [...seen].map(([label, h]) => `<a href="#" class="ref tellref" data-hunk="${esc(h)}">${esc(label)}</a>`).join("");
    };
    function readyPanel() {
      const R = D.ready || {}, tells = D.tells || [], desc = D.descriptionCheck, split = D.split, anns = D.annotations || [];
      const chip = (tone, label, title) => `<span class="chip ${tone}"${title ? ` title="${esc(title)}"` : ""}>${esc(label)}</span>`;
      const chips = [];
      if (R.lines != null) chips.push(chip(R.tone || "warn", `${R.lines} lines in ${R.files} files: ${R.band}`));
      const C = R.checks;
      if (C) chips.push(ciChip(chip, C), ...(C.stale ? [chip("warn", "CI ran on the pushed head, not this one")] : []));
      const placed = anns.filter(a => a.row);
      if (anns.length) chips.push(chip(anns.some(a => a.level === "failure") ? "bad" : "warn",
        placed.length ? `CI: ${placed.length} annotation${placed.length === 1 ? "" : "s"} on changed lines` : `CI: ${anns.length} annotation${anns.length === 1 ? "" : "s"} elsewhere`));
      const L = M.lastPass;
      if (L) chips.push(L.fresh ? chip("warn", `${L.fresh} hunk${L.fresh === 1 ? "" : "s"} new since ${L.headSha.slice(0, 7)}`) : chip("good", `Nothing new since ${L.headSha.slice(0, 7)}`));
      if (R.implChanged && !R.testsChanged) chips.push(chip("warn", "No test changes"));
      chips.push(tells.length ? chip("warn", `${tells.length} flagged line${tells.length === 1 ? "" : "s"}`) : chip("good", "No flagged lines"));
      if (desc) {
        const n = (desc.unsupported || []).length + (desc.missing || []).length;
        chips.push(n ? chip("warn", `Description: ${n} mismatch${n === 1 ? "" : "es"}`) : chip("good", "Description matches the diff"));
        const ni = (desc.issue || []).length;
        if (ni) chips.push(chip("warn", `Issue: ${ni} ask${ni === 1 ? "" : "s"} not in the diff`));
      }
      const parts = [`<h2>Before you mark it ready</h2><div class="chips">${chips.join("")}</div>`];
      const byFile = list => {
        const out = {};

        return Object.entries(out);
      };
      if (tells.length) {
        const rows = byFile(tells).map(([fid, ts]) => {
          const links = ts.slice(0, 8).map(t => `<a href="#" class="ref tellref" data-row="${P}r-${fid}-${t.line}" data-hunk="${t.hunk}" title="${esc(t.text)}">${esc(t.label)} ${t.line}</a>`).join("");
          return `<li><code>${esc(files[fid].path)}</code> ${links}${ts.length > 8 ? ` <span class="why-note">and ${ts.length - 8} more</span>` : ""}</li>`;
        });

          + as.slice(0, 8).map(a => `<a href="#" class="ref tellref" data-row="${P}r-${fid}-${a.row}" data-hunk="${a.hunk}" title="${esc(a.message)}">${esc(a.title || a.level)} ${a.row}</a>`).join("")
          + `${as.length > 8 ? ` <span class="why-note">and ${as.length - 8} more</span>` : ""}</li>`);
        const rest = anns.filter(a => !a.row);
        const elsewhere = rest.slice(0, 12).map(a => `<li><code>${esc(a.path)}:${a.line}</code> ${esc(a.title || a.level)}: <span class="why-note">${esc(a.message)}</span></li>`);
        parts.push(`<details open><summary>CI annotations</summary><ul>${rows.join("")}</ul>`
          + (rest.length ? `<p class="why-note">${rest.length} on lines this PR doesn't change${rest.length > 12 ? ", the first 12 here" : ""}:</p><ul>${elsewhere.join("")}</ul>` : "") + `</details>`);
      }
      // Only where the description or the linked issue and the diff disagree; the claims the diff does carry out
      // come last, collapsed.

      }

        parts.push(`<details open><summary>Linked issue vs diff</summary><ul>${asks.join("")}</ul></details>`);
      }

      if (risky.length) parts.push(`<details open><summary>Needs a careful read</summary><ul>${risky.map(([sec, i]) => `<li><a href="#${P}s${i + 1}">§${pad2(i + 1)} ${esc(sec.title)}</a>: ${esc(sec.risk)}</li>`).join("")}</ul></details>`);
      if ((D.try || []).length) parts.push(`<details open><summary>Try by hand</summary><ul>${D.try.map(x => `<li>${prose(x)}</li>`).join("")}</ul></details>`);
      if (split) {
        const prs = split.prs.map((pr, k) => `<li>PR ${k + 1}: ${pr.map(n => `<a href="#${P}s${n}">§${pad2(n)} ${esc(D.sections[n - 1].title)}</a>`).join(", ")}</li>`);
        parts.push(`<details open><summary>Could be ${split.prs.length} PRs</summary>${split.note ? `<p class="why-note">${esc(split.note)}</p>` : ""}<ul>${prs.join("")}</ul></details>`);

        `<li>${x.from === "issue" ? "<b>Issue:</b> " : ""}<q>${esc(x.claim)}</q> ${hunkLinks(x.hunks)}${note(x)}</li>`).join("")}</ul></details>`);
      const panel = $("ready");
      panel.innerHTML = parts.join("");
      panel.querySelectorAll("a[data-hunk]").forEach(a => a.onclick = e => { e.preventDefault(); a.dataset.row ? goToRow(a.dataset.row, a.dataset.hunk) : goTo(a.dataset.hunk); });
      panel.querySelectorAll("a[data-to]").forEach(a => a.onclick = e => { e.preventDefault(); goTo(a.dataset.to); });
    }

    header();
    sections();
    readyPanel();
    const api = { goTo, redraw: sections };
    MOUNTS.push(api);
    return api;
  }

  // ---- the stack: one layer at a time, with the panel above to move between them ----
  function crossRefs(n) {
    const out = {};
    const add = (hid, x) => (out[hid] = out[hid] || []).push(x);
    ((STACK && STACK.links) || []).forEach(l => {
      const [fn, fh] = l.from.split(":");
      if (+fn === n) add(fh, { name: l.name, up: true, refs: l.usedIn });
      l.usedIn.forEach(u => { const [un, uh] = u.split(":"); if (+un === n) add(uh, { name: l.name, up: false, refs: [l.from] }); });
    });
    return out;
  }
  function sectionOf(n, hid) {
    const D = BY_NUM[n];
    return D ? D.sections.findIndex(s => s.files.some(x => x.hunks.includes(hid))) : -1;
  }
  // One link per layer and section, labelled "#1014 §05", with the section title and file as its tooltip.
  function refLinks(refs) {
    const seen = new Map();
    refs.forEach(r => {
      const [n, hid] = r.split(":"), D = BY_NUM[+n], i = sectionOf(+n, hid);
      const label = `#${n} ` + (i >= 0 && D.sections[i].kind === "guide" ? `§${pad2(i + 1)}` : hid);
      const f = D && D.files.find(f => f.hunks.some(h => h.id === hid));

    });

  }
  const wrap = document.getElementById("wrap");
  const boxes = {};
  function shell(P, k) {
    const box = el("div", "layer");
    const nav = k == null ? "" : navBar(k);
    box.innerHTML = nav + `<header class="top"><div class="crumbs" id="${P}crumbs"></div><h1 id="${P}title"></h1>`
      + `<div class="meta" id="${P}meta"></div><ul class="index" id="${P}index"></ul>`
      + `<section class="ready" id="${P}ready" aria-label="Before you mark it ready"></section></header>`
      + `<main class="guide" id="${P}guide"></main>`;
    box.querySelectorAll(".lnav button").forEach(b => b.onclick = () => show(+b.dataset.n));

  }
  function navBar(k) {
    const btn = (D, arrow) => D ? `<button class="btn" type="button" data-n="${D.meta.number}" title="${esc(D.meta.title)}">${arrow} #${D.meta.number} ${esc(D.meta.title)}</button>` : "<span></span>";

  }
  function jump(n, id) {
    if (!boxes[n]) return;

    mounted[n].goTo(id);
  }
  // Summaries are plain text in a button, so any link syntax keeps only its phrase.
  const plain = t => esc(String(t || "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1"));
  const xprose = t => esc(t || "").replace(/\[([^\]]+)\]\((\d+:f\d+(?:h\d+)?)\)/g, (_m, phrase, id) => `<a href="#" class="ref" data-to="${id}">${phrase}</a>`);
  const KIND = { churn: "Rewritten further up", placement: "Belongs in another layer", order: "Needs a later layer", description: "Description", other: "Note" };
  function layerRow(D, summary) {
    const M = D.meta, R = D.ready || {}, impl = D.stats.categories.implementation || { add: 0, del: 0 };
    const row = STACK.layers.find(x => x.number === M.number) || {};
    const chip = (tone, label) => `<span class="chip ${tone}">${esc(label)}</span>`;
    const chips = [];
    if (row.needsRebase) chips.push(chip("bad", "Needs a rebase"));
    if (R.lines != null) chips.push(chip(R.tone || "warn", `${R.lines} lines`));
    const C = R.checks;
    if (C) chips.push(ciChip(chip, C));
    if ((D.tells || []).length) chips.push(chip("warn", `${D.tells.length} flagged`));
    const desc = D.descriptionCheck, dn = desc ? (desc.unsupported || []).length + (desc.missing || []).length : 0;
    if (dn) chips.push(chip("warn", `Description: ${dn} mismatch${dn === 1 ? "" : "es"}`));
    const ni = desc ? (desc.issue || []).length : 0;
    if (ni) chips.push(chip("warn", `Issue: ${ni} not in the diff`));
    const risky = D.sections.filter(s => s.kind === "guide" && s.risk).length;
    if (risky) chips.push(chip("warn", `${risky} careful read${risky === 1 ? "" : "s"}`));
    return `<li data-n="${M.number}"><button class="lrow" type="button" data-n="${M.number}"><span class="n">#${M.number}</span>`
      + `<span class="t">${esc(M.title)}</span><span class="num">${counts(impl.add, impl.del)}</span>`
      + `<span class="chips">${chips.join("")}</span>${summary ? `<span class="lsum">${plain(summary)}</span>` : ""}</button></li>`;
  }
  function stackPanel() {
    const chk = STACK.check || {}, base = LAYERS[0].meta.base;
    const summary = Object.fromEntries((chk.layers || []).map(x => [x.number, x.summary]));
    const panel = el("details", "stack");
    panel.open = true;
    const issues = (chk.issues || []).map(x => `<li><b>${esc(KIND[x.kind] || KIND.other)}</b> <span class="why-note">${esc((x.layers || []).map(n => "#" + n).join(", "))}</span> `
      + `${xprose(x.problem)}${x.fix ? ` <span class="why-note">${xprose(x.fix)}</span>` : ""}</li>`);
    const top = LAYERS[LAYERS.length - 1].meta.number;
    panel.innerHTML = `<summary class="stack-head"><h2>Stack of ${LAYERS.length} PRs</h2><span class="mono">${esc(STACK.repo)}, top first</span></summary>`
      + `<div class="stack-inner"><div class="stack-body${issues.length ? " two" : ""}">`
      + `<ol class="layers">${LAYERS.map(D => layerRow(D, summary[D.meta.number])).reverse().join("")}<li class="trunk mono">${esc(base)}</li></ol>`
      + (issues.length ? `<section class="across"><h3>Across the stack</h3><ul>${issues.join("")}</ul></section>` : "") + `</div>`
      + ((STACK.forks || []).length ? `<p class="why-note">The stack forks above #${top} into ${STACK.forks.map(n => "#" + n).join(" and ")}; build the page from the top PR of a branch to include it.</p>` : "")
      + `</div>`;

  if (!STACK) {

    (function next() { const D = LAYERS[k++]; if (!D) return; ensure(D.meta.number); setTimeout(next, 30); })();
  }

  // ---- review notes: kept in this browser and editable until sent, then posted as one comment sent to Claude ----
  (async () => {

    // work, and Copy notes takes them to the session; only Send needs it.
    const c = window.claude && window.claude.use ? await window.claude.use("comments").catch(() => null) : null;
    document.body.classList.add("can-comment");
    if (STACK) LAYERS.forEach(D => ensure(D.meta.number));
    const OFF = "Sending from this page isn't available here. Your notes are kept in this browser.";
    const MSG = {
      consent_required: "Not sent: this page needs your permission to comment, and won't ask again until you reload. Your notes are kept.",
      rate_limited: "Sent too often. Wait a moment, then try again.",
      invalid: "The notes couldn't be posted as written. Shorten the longest note and try again.",
      writers_only: "Only editors of this page can send notes to Claude.",
      no_session: "No Claude session is watching this page right now. Your notes are kept.",
      claude_unavailable: "No Claude session could take the notes right now. Your notes are kept.",
    };
    // After these, no send from this page load can succeed.
    const FINAL = new Set(["consent_required", "forbidden", "not_granted", "capability_disabled", "capability_removed"]);

    // Keyed by the note's location line, which names the layer, file, line and commit. prg:draft: is the older
    // key for unsent comment text, read so nothing typed before notes existed is lost.

    // would then reach the session as asks. There notes stay in this tab, and apart per PR.

    const KEYS = [`prg:note:${SCOPE}`, `prg:draft:${SCOPE}`];

        + `<textarea rows="3" maxlength="3000" aria-label="Note on ${esc(loc)}" placeholder="Note on this line"></textarea>`
        + `<div class="cmp-row"><button class="btn primary" type="button" data-act="done">Done</button>`

    function goNote(loc) {

    }

    function panel(status) {
      const old = document.getElementById("notes"), list = notes.all();

      const box = old || el("section", "notes");
      box.id = "notes";
      const n = list.length, nCopied = list.filter(([l, t]) => isCopied(l, t)).length;
      box.innerHTML = `<div class="notes-head">${n ? `<b>Your notes (${n})</b><span class="why-note">kept in this browser until ${c ? "sent" : "copied"}</span>`
        + (c ? `<button class="btn primary" type="button" data-send>Send ${n} note${n === 1 ? "" : "s"} to Claude</button>` : "")
        + `<button class="btn${c ? "" : " primary"}" type="button" data-copy title="Copy the notes to paste into your Claude session">Copy notes</button>`
        + (nCopied ? `<button class="btn ghost" type="button" data-clear>Clear ${nCopied} copied</button>` : "") : ""}`
        + `<span class="cmp-msg" role="status"></span></div>`

      box.querySelectorAll("li").forEach((li, i) => {
        li.querySelector(".why-note").textContent = list[i][1];
        li.querySelector("a").onclick = e => { e.preventDefault(); goNote(li.dataset.loc); };
        li.querySelector(".x").onclick = () => { notes.set(li.dataset.loc, ""); renderNotes(); };
      });
      const send = box.querySelector("[data-send]"), copy = box.querySelector("[data-copy]"), clear = box.querySelector("[data-clear]");
      if (send) send.onclick = () => sendNotes(send, list);
      if (copy) copy.onclick = () => copyNotes(list);
      if (clear) clear.onclick = () => {
        copied.forEach(([loc, text]) => { if (notes.get(loc) === text) notes.set(loc, ""); });
        copied = [];
        renderNotes("Cleared the copied notes.");
      };
      if (!old) wrap.prepend(box);
    }

    const D0 = LAYERS[0].meta;
    const scope = STACK ? `${STACK.repo} ${LAYERS.map(D => "#" + D.meta.number).join(", ")}, a stack`
      : D0.number ? `${D0.repo}#${D0.number} at ${D0.headSha.slice(0, 7)}` : `${D0.repo} ${D0.head} at ${D0.headSha.slice(0, 7)}`;
    const bytes = t => new TextEncoder().encode(t).length;
    const request = (list, how) => `pr-review-guide: please work through ${list.length === 1 ? "this review note" : `these ${list.length} review notes`} on ${scope}. `
      + `${list.length === 1 ? "It starts" : "Each starts"} with its location. Fix what they ask in the working tree, leave it unstaged, ${how}`;
    const noteText = ([loc, text]) => `${loc}\n${text.trim()}`;

    // Called from the click, which the clipboard needs; where the browser refuses, the text is shown selected for Cmd+C.
    function copyNotes(list) {
      const text = [request(list, "and report back with one line per note."), ...list.map(noteText)].join("\n\n");
      const done = () => { copied = list.slice(); renderNotes(`Copied ${list.length} note${list.length === 1 ? "" : "s"}. Paste into your Claude session, then clear them here.`); };
      const manual = () => {
        copied = list.slice();
        panel("The browser blocked the clipboard: the notes are selected below, so press Cmd+C.");
        const area = el("textarea", "copybox");
        area.readOnly = true;
        area.rows = 6;
        area.value = text;
        document.getElementById("notes").appendChild(area);
        area.focus();
        area.select();
      };
      try { navigator.clipboard.writeText(text).then(done, manual); } catch (e) { manual(); }
    }

    // A comment takes 4 KiB; past that the notes go as several parts in one thread, the first sent to Claude.
    const LIMIT = 3600;
    // Sent to Claude as a comment, which wakes the session watching the page; that session reports back where it runs.
    async function sendNotes(btn, list) {
      const msg = btn.parentElement.querySelector(".cmp-msg");
      if (btn.disabled) return;
      btn.disabled = true;
      msg.textContent = "Sending…";
      const intro = request(list, "report back in the session with one line per note, then resolve this thread.");
      const parts = [intro];
      for (const [loc, text] of list) {
        const item = noteText([loc, text]), last = parts.length - 1;
        if (bytes(parts[last] + "\n\n" + item) > LIMIT) parts.push(item); else parts[last] += "\n\n" + item;
      }
      if (parts.length > 1) {
        parts[0] = parts[0].replace(intro, `${intro} They come in ${parts.length} parts; read the thread until all ${parts.length} are there.`);
        for (let i = 1; i < parts.length; i++) parts[i] = `Part ${i + 1} of ${parts.length}\n\n${parts[i]}`;
      }
      let posted = 0;
      try {
        const can = await c.canSendToClaude();
        if (can !== "available") { msg.textContent = MSG[can] || OFF; btn.disabled = false; return; }
        // Pinned to the shown layer's title, which survives a rebuild of the page.
        const at = document.querySelector(".layer:not([hidden]) h1") || document.querySelector("h1");
        const { threadId } = await c.sendToClaude({ anchor: await c.anchorFor(at), text: parts[0] });
        posted = 1;
        for (const part of parts.slice(1)) { await c.reply(threadId, part); posted++; }
        list.forEach(([loc, text]) => { if (notes.get(loc) === text) notes.set(loc, ""); });
        renderNotes(`Sent ${list.length} note${list.length === 1 ? "" : "s"}. Claude reports back in the session watching this page.`);
      } catch (err) {
        const code = err && err.code;
        msg.textContent = posted ? `Only ${posted} of ${parts.length} parts went through, and Claude was told to expect ${parts.length}. Your notes are kept.`
          : MSG[code] || (FINAL.has(code) ? OFF : "Not sent. Your notes are kept; try again.");
        btn.disabled = FINAL.has(code);
      }
    }
    // A change of layout draws every line again, so the notes find theirs again; an open editor keeps its text in storage.
    wrap.addEventListener("prg:redrawn", () => { editing = null; renderNotes(); });
    renderNotes();
  })();
})();
</script>
